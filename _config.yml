title: Articles
description: Write-ups of things I have built or investigated.
author: Paul Slusarz
url: https://pslusarz.github.io
baseurl: /articles
lang: en

theme: minima

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# The legacy builder got these from jekyll-default-layout.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

giscus:
  repo: pslusarz/articles
  repo_id: R_kgDOK80WSw
  category: Announcements
  category_id: DIC_kwDOK80WS84DG7Pv

